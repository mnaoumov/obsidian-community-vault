name: Feature request
description: Request a feature and help improve the project
title: "[FR] Don't forget to write a meaningful title"
labels: enhancement
assignees: mnaoumov
body:
  - type: markdown
    attributes:
      value: |
        ## Feature request

        > [!WARNING]
        >
        > Incomplete, vague, or poorly described requests will be closed.
        >
        > The feature request and all attachments must be in English. Exception: the request is directly related to non-English language usage. Non-English feature requests will be closed.
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the feature request. Include any relevant details.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use case
      description: Describe a scenario where this feature would be useful.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired behavior
      description: What do you want to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current behavior
      description: What actually happens?
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The version, release or commit you used. ⚠️ Must be the latest one. If not, explain why above.
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attachments
      description: Screenshots, videos or sample files that help explain the request.
      placeholder: Drag and drop files here.
  - type: checkboxes
    attributes:
      label: Confirmations
      description: Ensure the following conditions are met
      options:
        - label: I have checked the repository's issues and haven't found any similar feature requests
          required: true
